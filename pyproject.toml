[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceera-developer-radar"
version = "0.1.0"
description = "Evidence-grounded daily developer radar for VoiceERA"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13", "apscheduler>=3.10", "fastapi>=0.115", "feedparser>=6.0",
  "httpx>=0.27", "pydantic-settings>=2.5", "python-multipart>=0.0.9",
  "PyJWT[crypto]>=2.9",
  "sqlalchemy>=2.0", "streamlit>=1.38", "typer>=0.12", "uvicorn>=0.30"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
llm = ["openai>=1.50"]
test = ["pytest>=8.3", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
radar = "radar.cli:app"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
